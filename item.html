<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listing detail – Greg's Marketplace">
  <title>Listing – Greg's Marketplace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Away Banner -->
  <div id="away-banner" class="away-banner hidden" role="alert"></div>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a href="/" class="site-logo" aria-label="Greg's Marketplace home">
        <img src="/images/logo.svg" alt="Greg's Marketplace" class="logo-img">
      </a>
      <div class="header-actions"></div>
    </div>
  </header>

  <!-- Item Content -->
  <main id="main-content" role="main">
    <div class="item-page">

      <!-- Breadcrumb -->
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
        <a href="/">All Listings</a>
        <span class="breadcrumb-sep">›</span>
        <span>Loading…</span>
      </nav>

      <!-- Item content populated by item.js -->
      <div id="item-content">

        <!-- Gallery + Info side-by-side -->
        <div class="item-layout">

          <!-- Left: Photo Gallery -->
          <section aria-label="Item photos">
            <div class="item-gallery">
              <div class="gallery-main" id="gallery-main" role="button" tabindex="0" aria-label="Click to enlarge photo" title="Click to view full size">
                <img id="gallery-main-img" src="/images/placeholder.svg" alt="Item photo">
                <div class="gallery-sold-badge hidden" id="gallery-sold-badge" aria-label="Sold">SOLD</div>
                <div class="gallery-zoom-hint" aria-hidden="true">🔍 Click to zoom</div>
              </div>
              <div class="gallery-thumbs" id="gallery-thumbs" role="list" aria-label="Photo thumbnails"></div>
            </div>
          </section>

          <!-- Right: Info Panel -->
          <aside aria-label="Item details">
            <div class="item-info">

              <!-- Cross-listing badges -->
              <div class="item-cross-badges" id="cross-badges" aria-label="Also listed on"></div>

              <!-- Title & price -->
              <div class="item-title-area">
                <div class="item-category-label" id="item-category">Category</div>
                <h1 class="item-title-text" id="item-title">Loading…</h1>
                <div class="item-condition" id="item-condition"></div>
              </div>

              <div class="item-price-area" id="price-area">
                <div class="item-price" id="item-price">$—</div>
              </div>

              <!-- Location -->
              <div class="item-location" id="item-location" aria-label="Seller location"></div>

              <!-- PayPal -->
              <div id="paypal-area">
                <!-- Populated by item.js -->
              </div>

              <!-- Shipping Estimate -->
              <div class="shipping-estimate" id="shipping-estimate" aria-label="Shipping estimate">
                <!-- Populated by item.js -->
              </div>

            </div>
          </aside>
        </div>

        <!-- Accordion Details -->
        <section class="accordion-section" aria-label="Item information">

          <div class="accordion-item open" id="acc-item-description">
            <button class="accordion-header" aria-expanded="true" aria-controls="acc-body-description">
              <span>Description</span>
              <svg class="accordion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="accordion-body" id="acc-body-description" role="region">
              <div class="accordion-body-inner">
                <p id="acc-description">Loading…</p>
              </div>
            </div>
          </div>

          <div class="accordion-item" id="acc-item-details">
            <button class="accordion-header" aria-expanded="false" aria-controls="acc-body-details">
              <span>Item Details</span>
              <svg class="accordion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="accordion-body" id="acc-body-details" role="region">
              <div class="accordion-body-inner">
                <div id="acc-details">No additional details provided.</div>
              </div>
            </div>
          </div>

          <div class="accordion-item" id="acc-item-shipping">
            <button class="accordion-header" aria-expanded="false" aria-controls="acc-body-shipping">
              <span>Shipping &amp; Pickup</span>
              <svg class="accordion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="accordion-body" id="acc-body-shipping" role="region">
              <div class="accordion-body-inner">
                <div id="acc-shipping">Loading…</div>
              </div>
            </div>
          </div>

        </section>

      </div><!-- /#item-content -->
    </div><!-- /.item-page -->
  </main>

  <!-- Lightbox -->
  <div id="lightbox-overlay" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Full size photo" style="display:none">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">✕</button>
    <button id="lightbox-prev" class="lightbox-prev" aria-label="Previous photo" style="display:none">‹</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Full size item photo">
    </div>
    <button id="lightbox-next" class="lightbox-next" aria-label="Next photo" style="display:none">›</button>
    <div id="lightbox-counter" class="lightbox-counter" aria-live="polite"></div>
  </div>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="footer-name">Greg's Marketplace</div>
        <div>Personal buy/sell listings</div>
      </div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="/">← All Listings</a>
      </nav>
    </div>
    <div class="footer-bottom">
      &copy; <span id="footer-year"></span> Greg's Marketplace &mdash; Payments secured by PayPal
    </div>
  </footer>

  <script src="/js/item.js"></script>
  <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" role="img" aria-label="Greg's Marketplace">
  <!-- Storefront icon -->
  <!-- Building body -->
  <rect x="2" y="22" width="46" height="28" rx="3" fill="#0064D2"/>
  <!-- Awning -->
  <rect x="0" y="13" width="50" height="13" rx="3" fill="#E53238"/>
  <!-- Awning stripe -->
  <rect x="8"  y="13" width="5" height="13" fill="#F5AF02" opacity="0.7"/>
  <rect x="19" y="13" width="5" height="13" fill="#F5AF02" opacity="0.7"/>
  <rect x="30" y="13" width="5" height="13" fill="#F5AF02" opacity="0.7"/>
  <rect x="41" y="13" width="5" height="13" fill="#F5AF02" opacity="0.7"/>
  <!-- Awning scallop -->
  <path d="M0 26 Q6.25 30 12.5 26 Q18.75 30 25 26 Q31.25 30 37.5 26 Q43.75 30 50 26" fill="none" stroke="#C0392B" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="17" y="34" width="16" height="16" rx="2" fill="white" opacity="0.95"/>
  <circle cx="28" cy="42" r="1.2" fill="#0064D2"/>
  <!-- Left window -->
  <rect x="5"  y="26" width="9" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Right window -->
  <rect x="36" y="26" width="9" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Ground line -->
  <line x1="0" y1="50" x2="50" y2="50" stroke="#86B817" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "Greg's" in eBay-style colored letters -->
  <text font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-size="24" y="32" x="60">
    <tspan fill="#E53238">G</tspan><tspan fill="#0064D2">r</tspan><tspan fill="#F5AF02">e</tspan><tspan fill="#86B817">g</tspan><tspan fill="#374151">'s</tspan>
  </text>

  <!-- "Marketplace" subtitle -->
  <text x="61" y="48" font-family="'Arial','sans-serif'" font-size="13.5" fill="#6B7280" letter-spacing="1.5" font-weight="600">MARKETPLACE</text>
</svg>
